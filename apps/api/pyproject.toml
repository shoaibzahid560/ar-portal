[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-portal-api"
version = "0.1.0"
description = "API for the AR Operations Portal"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "xlsxwriter>=3.2",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14",
  "pytest>=8",
  "httpx2>=2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
